[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repairnear"
version = "0.1.0"
description = "Local directory of repair and reuse services"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
repairnear = "repairnear.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
